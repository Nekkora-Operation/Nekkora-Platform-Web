# FRONT-V1-001 — complemento do laboratório DESCARTÁVEL do frontend sobre api/e2e/compose.e2e.yml da API (a API não é
# alterada). Só vale para o projeto criado por tools/lab/subir.sh (ensaio-*), nunca para ambiente preservado.
#
# - origem pública = Vite (http://localhost:5173): o navegador fala só com o Vite, que repassa /api ao nginx do laboratório
#   (NEKKORA_API_URL); Origin e cookies __Host- seguem a origem do Vite;
# - cadastro web ligado (as demais chaves de identidade já vêm ligadas no compose E2E da API);
# - e-mail pelo transporte de HOMOLOGAÇÃO: cada mensagem vira arquivo na caixa (volume exclusivo do projeto, dono nekkora,
#   0700), sem envio externo; a leitura é por `node tools/lab/lab.mjs <id> caixa`;
# - armazenamento local dos artefatos recebidos (NEKKORA_ARTEFATOS_DIR, migration 028), volume do projeto;
# - limites de memória (histórico de pressão de memória nas suítes pesadas).
# - banco num volume NOMEADO do projeto (PLATFORM-LOCAL-001): `docker compose stop`/`start` e a recriação de um container
#   preservam os dados; só uma remoção explícita do volume os apaga.
volumes:
  artefatos: {}
  # PLATFORM-CLIENT-EXECUCAO-REMOTA-001 (T03b): resultados das execuções remotas. O gateway GRAVA; a Platform LÊ.
  resultados: {}
  caixa: {}
  pgdados: {}

services:
  platform:
    mem_limit: 900m
    environment:
      NEKKORA_ORIGEM_PUBLICA: ${FRONT_ORIGEM:-http://localhost:5173}
      NEKKORA_CADASTRO: "true"
      NEKKORA_AMBIENTE: ${FRONT_AMBIENTE:?defina FRONT_AMBIENTE}
      NEKKORA_MAIL_TRANSPORTE: homologacao
      NEKKORA_MAIL_CAIXA: /caixa
      NEKKORA_ARTEFATOS_DIR: /var/lib/nekkora/artefatos
      # PLATFORM-CLIENT-EXECUCAO-REMOTA-001: desligada por padrão; no laboratório, liga com LAB_EXECUCAO_REMOTA=true em
      # segredos.env (o mesmo valor vai para a Platform e para o gateway)
      NEKKORA_EXECUCAO_REMOTA: ${LAB_EXECUCAO_REMOTA:-false}
      NEKKORA_RESULTADOS_DIR: /var/lib/nekkora/resultados
      # fechamento da missão: os prazos abaixo têm os padrões do produto; o laboratório pode encurtá-los em segredos.env para
      # ensaiar sem esperar (espera da comunicação perdida, ciclo da reconciliação, retenção no servidor)
      NEKKORA_EXECUCAO_REMOTA_SEM_COMUNICACAO_MINUTOS: ${LAB_SEM_COMUNICACAO_MINUTOS:-120}
      NEKKORA_EXECUCAO_REMOTA_RECONCILIACAO_SEGUNDOS: ${LAB_RECONCILIACAO_SEGUNDOS:-60}
      NEKKORA_EXECUCAO_REMOTA_RETENCAO: ${LAB_RETENCAO:-false}
      NEKKORA_EXECUCAO_REMOTA_RETENCAO_DIAS: ${LAB_RETENCAO_DIAS:-30}
      NEKKORA_EXECUCAO_REMOTA_RETENCAO_CICLO_MINUTOS: ${LAB_RETENCAO_CICLO_MINUTOS:-60}
    volumes:
      - artefatos:/var/lib/nekkora/artefatos
      # a Platform só LÊ os resultados; com a retenção ligada no laboratório (LAB_RESULTADOS_NA_PLATFORM=rw) ela também os remove
      - resultados:/var/lib/nekkora/resultados:${LAB_RESULTADOS_NA_PLATFORM:-ro}
      - caixa:/caixa
  portal:
    mem_limit: 512m
    # PLATFORM-FLUXO-002 (070): a area do cliente baixa os arquivos de resultado concedidos; o Portal so LE a pasta
    environment:
      NEKKORA_RESULTADOS_DIR: /var/lib/nekkora/resultados
    volumes:
      - resultados:/var/lib/nekkora/resultados:ro
  agent-gateway:
    mem_limit: 640m
    environment:
      NEKKORA_EXECUCAO_REMOTA: ${LAB_EXECUCAO_REMOTA:-false}
      # a mesma espera da Platform (tem de ter o mesmo valor nos dois)
      NEKKORA_EXECUCAO_REMOTA_SEM_COMUNICACAO_MINUTOS: ${LAB_SEM_COMUNICACAO_MINUTOS:-120}
      # PLATFORM-CLIENT-EXECUCAO-REMOTA-001 (T03): o gateway LÊ os pacotes publicados para entregá-los à máquina da tentativa
      NEKKORA_ARTEFATOS_DIR: /var/lib/nekkora/artefatos
      NEKKORA_RESULTADOS_DIR: /var/lib/nekkora/resultados
    volumes:
      - artefatos:/var/lib/nekkora/artefatos:ro
      - resultados:/var/lib/nekkora/resultados
  postgres:
    mem_limit: 768m
    volumes:
      - pgdados:/var/lib/postgresql/data
  redis:
    mem_limit: 128m
